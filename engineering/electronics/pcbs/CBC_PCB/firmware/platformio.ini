; CBC_PCB firmware — ESP32-S3-WROOM-1-N16R8
; Build:  pio run
; Flash:  pio run -t upload        (via USB-C -> CP2102N, auto-reset)
; Serial: pio device monitor -b 115200

[env:cbc]
; pioarduino platform = Arduino core 3.x. The official `espressif32` platform is
; frozen on Arduino core 2.0.x, which boot-loops on the S3 N16R8 module
; (rst:0x3, no output) — known issue; Arduino IDE 2.3+ (core 3.x) works fine.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB OCTAL PSRAM (PSRAM unused for now)
; The devkitc-1 board default is qio_qspi (quad PSRAM) — on N16R8 (octal) that
; builds a mismatched image and the chip boot-loops (rst:0x3) with no output.
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; Console goes through UART0 -> CP2102N (U302) -> USB-C, NOT native USB CDC
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 460800

; CP2102N + UMH3N auto-program circuit: keep the monitor from
; holding/toggling DTR & RTS (causes endless reset loops on open)
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    autowp/autowp-mcp2515@^1.2.1
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
