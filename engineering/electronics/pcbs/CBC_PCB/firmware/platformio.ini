; CBC_PCB firmware — ESP32-S3-WROOM-1-N16R8
; Build:  pio run
; Flash:  pio run -t upload        (via USB-C -> CP2102N, auto-reset)
; Serial: pio device monitor -b 115200

[env:cbc]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB octal PSRAM (PSRAM unused for now)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Console goes through UART0 -> CP2102N (U302) -> USB-C, NOT native USB CDC
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 460800

; CP2102N + UMH3N auto-program circuit: keep the monitor from
; holding/toggling DTR & RTS (causes endless reset loops on open)
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    autowp/autowp-mcp2515@^1.2.1
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
